version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterpriseflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: enterpriseflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterpriseflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterpriseflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterpriseflow-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=enterpriseflow_db;Username=postgres;Password=postgrespassword;Include Error Detail=true
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Secret=EnterpriseFlowSuperSecretKey2026!WithSufficientLengthForHmacSha256
      - JwtSettings__Issuer=EnterpriseFlowApi
      - JwtSettings__Audience=EnterpriseFlowClients
      - JwtSettings__ExpiryMinutes=15
      - JwtSettings__RefreshTokenExpiryDays=7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
